  summary: >-
    Reprezentuje kategorię składników spożywczych (np. "Nabiał", "Mięso", "Warzywa", "Inne").

    Każda kategoria może zawierać wiele składników (<xref href="SpizarniaAPI.Models.Ingredient" data-throw-if-not-resolved="false"></xref>).

    Kategoria "Inne" tworzona jest automatycznie przez <code>PantryController</code> dla nowych produktów.
